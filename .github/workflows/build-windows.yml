name: Build Windows package

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main, feira-mulheres-na-ciencia, feira-windows-package]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go-backend/go.mod
          cache-dependency-path: go-backend/go.sum

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        shell: pwsh
        run: flutter config --enable-windows-desktop

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Generate Windows project files
        run: flutter create --platforms=windows .
      - name: Build backend
        working-directory: go-backend
        run: go build -trimpath -ldflags="-s -w" -o server.exe .

      - name: Build Flutter application
        run: flutter build windows --release

      - name: Assemble package
        shell: pwsh
        run: |
          $package = "dist/Asteroids-Windows"
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item -Recurse -Force "build/windows/x64/runner/Release/*" $package
          New-Item -ItemType Directory -Force -Path "$package/go-backend" | Out-Null
          Copy-Item "go-backend/server.exe" "$package/go-backend/server.exe"
          Copy-Item "go-backend/asteroids.db" "$package/go-backend/asteroids.db"
          Copy-Item "iniciar.bat" "$package/iniciar.bat"
          Compress-Archive -Path "$package/*" -DestinationPath "dist/Asteroids-Windows.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Asteroids-Windows
          path: dist/Asteroids-Windows.zip
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Asteroids-Windows.zip
          generate_release_notes: true